plugins { id 'com.android.application' }

android {
    namespace 'com.blockpojav.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.blockpojav.launcher'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1-java-alpha'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
